server {
    listen 80;
    server_name localhost;

    # Kubernetes CoreDNS IP Resolver (Only IP allowed in resolver directive)
    resolver 10.96.0.10 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to Tier 2 Backend Application
    location /api/ {
        set $backend_upstream "http://backend.three-tier-app.svc.cluster.local:5000";
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
